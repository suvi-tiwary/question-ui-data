<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Trailers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="spot"></div><div class="bar top"></div><div class="bar bot"></div>
<main>
  <section id="cast" class="screen on">
    <div class="marquee">A CODING PRODUCTION</div>
    <h1 class="title">YOUR NEXT<br><em>INTERVIEW</em></h1>
    <p class="tag">Pick your role. Pick your level. Roll the trailer.</p>
    <div class="cast">
      <div><label>Role</label><div class="chips" id="roles"></div></div>
      <div><label>Level</label><div class="chips" id="levels"></div></div>
      <div><button class="btn" id="play">NEXT QUESTION &#8594;</button><p class="count" id="count"></p></div>
    </div>
    <p class="load" id="load"></p>
  </section>
  <section id="scene" class="screen"></section>
</main>
<script>
const $=id=>document.getElementById(id);
let DATA=[],pick={role:null,level:null},list=[],i=0;
const LEVELS=['Easy','Medium','Hard'];
const ROLE_QUESTIONS=[
  {role:'Backend',level:'Easy',description:'An API gateway records the HTTP status code for each request. Given the status codes, return how many requests succeeded. A request succeeds when its status is from 200 through 299.',testCases:[{input:{statuses:[200,201,404,503,204]},expectedOutput:3}]},
  {role:'Backend',level:'Medium',description:'Implement a fixed-window rate limiter. For each request timestamp, allow the request only if fewer than limit requests have already been allowed in the same window. Windows start at multiples of windowSeconds. Return one boolean per request.',testCases:[{input:{timestamps:[1,2,3,11,12],windowSeconds:10,limit:2},expectedOutput:[true,true,false,true,true]}]},
  {role:'Backend',level:'Hard',description:'Services depend on other services before they can start. Given service names and dependency pairs [service, prerequisite], return false if the dependencies contain a cycle, otherwise true.',testCases:[{input:{services:['api','auth','db'],dependencies:[['api','auth'],['auth','db']]},expectedOutput:true},{input:{services:['api','auth'],dependencies:[['api','auth'],['auth','api']]},expectedOutput:false}]},
  {role:'Full Stack',level:'Easy',description:'A product list is searched by name. Return the names containing the query, ignoring letter case, while preserving their original order.',testCases:[{input:{names:['Keyboard','Mouse','Keycap'],query:'key'},expectedOutput:['Keyboard','Keycap']}]},
  {role:'Full Stack',level:'Medium',description:'A table displays filtered rows over multiple pages. Given the already-filtered rows, a one-based page number, and page size, return the rows on that page. Return an empty array when the page is past the end.',testCases:[{input:{rows:['a','b','c','d','e'],page:2,pageSize:2},expectedOutput:['c','d']}]},
  {role:'Full Stack',level:'Hard',description:'Apply optimistic UI updates to a list of records. Each update is [id, value]; replace the matching record value, or append a new record if the id is not present. Return the final records in their original order, with new records appended in update order.',testCases:[{input:{records:[{id:1,value:'old'},{id:2,value:'keep'}],updates:[[1,'new'],[3,'added']]},expectedOutput:[{id:1,value:'new'},{id:2,value:'keep'},{id:3,value:'added'}]}]},
  {role:'Data Engineer',level:'Easy',description:'Count events by source. Ignore events whose source is null, and return an object mapping each remaining source to its count.',testCases:[{input:{sources:['web','batch','web',null,'api','batch','web']},expectedOutput:{web:3,batch:2,api:1}}]},
  {role:'Data Engineer',level:'Medium',description:'Deduplicate events by id, keeping the event with the greatest timestamp for each id. Return the retained events sorted by id ascending.',testCases:[{input:{events:[{id:2,timestamp:4},{id:1,timestamp:3},{id:2,timestamp:8}]},expectedOutput:[{id:1,timestamp:3},{id:2,timestamp:8}]}]},
  {role:'Data Engineer',level:'Hard',description:'Merge several individually sorted event-time streams into one sorted stream. Preserve duplicate timestamps.',testCases:[{input:{streams:[[1,4,9],[2,4,7],[3,8]]},expectedOutput:[1,2,3,4,4,7,8,9]}]},
  {role:'Software Developer',level:'Easy',description:'Given a string, return the first character that appears exactly once. Return an empty string if every character repeats.',testCases:[{input:{text:'swiss'},expectedOutput:'w'},{input:{text:'aabb'},expectedOutput:''}]},
  {role:'Software Developer',level:'Medium',description:'Given a list of closed intervals, merge all overlapping intervals and return the result sorted by start value.',testCases:[{input:{intervals:[[1,3],[2,6],[8,10],[9,12]]},expectedOutput:[[1,6],[8,12]]}]},
  {role:'Software Developer',level:'Hard',description:'Given tasks and prerequisite pairs [task, prerequisite], return the lexicographically smallest valid order in which all tasks can be completed. Return an empty array if the prerequisites contain a cycle.',testCases:[{input:{tasks:['build','test','deploy'],prerequisites:[['test','build'],['deploy','test']]},expectedOutput:['build','test','deploy']},{input:{tasks:['a','b'],prerequisites:[['a','b'],['b','a']]},expectedOutput:[]}]}
];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=v=>esc(JSON.stringify(v));
function shuffle(items){
  const shuffled=[...items];
  for(let index=shuffled.length-1;index>0;index--){const swap=Math.floor(Math.random()*(index+1));[shuffled[index],shuffled[swap]]=[shuffled[swap],shuffled[index]]}
  return shuffled;
}

function init(data){
  DATA=data;
  const roles=[...new Set([...DATA.flatMap(q=>q.roleApplicability||[]),'Software Developer'])];
  const p=new URLSearchParams(location.search);       // ?role=Backend&level=Medium
  pick.role=roles.includes(p.get('role'))?p.get('role'):roles[0];
  pick.level=LEVELS.includes(p.get('level'))?p.get('level'):'Medium';
  chips('roles',roles,'role');chips('levels',LEVELS,'level');
  $('load').textContent='';count();
}
function chips(id,arr,key){
  $(id).innerHTML=arr.map(v=>`<button class="chip ${pick[key]===v?'sel':''}" data-v="${v}">${v.toUpperCase()}</button>`).join('');
  $(id).onclick=e=>{const b=e.target.closest('.chip');if(!b)return;pick[key]=b.dataset.v;chips(id,arr,key);count()};
}
const match=()=>DATA.filter(q=>(pick.role==='Software Developer'||(q.roleApplicability||[]).includes(pick.role))&&q.difficulty===pick.level);
function count(){const n=match().length+ROLE_QUESTIONS.filter(q=>q.role===pick.role&&q.level===pick.level).length;$('count').textContent=n?`${n} scene${n>1?'s':''} in this cut`:'No scenes for this role & level yet';$('play').disabled=!n;$('play').style.opacity=n?1:.4}
$('play').onclick=()=>{list=[...ROLE_QUESTIONS.filter(q=>q.role===pick.role&&q.level===pick.level),...shuffle(match())];if(!list.length)return;i=0;show('scene');render()};
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));scrollTo(0,0)}

function render(){
  const q=list[i],tc=(q.testCases||[]).filter(t=>!t.isHidden);
  $('scene').innerHTML=`<div class="scene">
    <div class="reel"><span>Scene ${i+1} of ${list.length} &middot; ${esc(pick.role)}</span><button class="btn ghost" id="back">&#8592; RE-CAST</button></div>
   <p class="story">${esc(q.description)}</p>
   <section class="test-cases"><h2>TEST CASES</h2>${tc.map((t,n)=>`<pre><b>Test ${n+1}</b>\n${Object.entries(t.input).map(([k,v])=>`${k} = ${fmt(v)}`).join('\n')}\n<b>&rarr;</b> ${fmt(t.expectedOutput)}</pre>`).join('')}</section>
   <div class="nav"><button class="btn ghost" id="prev" ${i?'':'disabled style="opacity:.3"'}>&#8592; PREVIOUS</button>
   <button class="btn ghost" id="next">${i<list.length-1?'NEXT SCENE &#8594;':'THE END'}</button></div></div>`;
  $('back').onclick=()=>show('cast');
  $('prev').onclick=()=>{if(i){i--;render();scrollTo(0,0)}};
  $('next').onclick=()=>{i<list.length-1?(i++,render(),scrollTo(0,0)):show('cast')};
}
addEventListener('keydown',e=>{if(!$('scene').classList.contains('on'))return;
  if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});

// Load the bundled question bank; fetch requires a local web server.
fetch('question.json.txt').then(r=>{
  if(!r.ok)throw new Error(`Question bank returned ${r.status}`);
  return r.json();
}).then(init).catch(()=>{
  $('load').textContent='Could not load questions. Open this page through a local web server.';
  $('play').disabled=true;
});
</script>
</body>
</html>
