<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0908">
  <title>QuickRuit — Random Interview Questions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="questionData.js"></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main>
    <section id="setupScreen" class="screen">
      <p class="eyebrow">QUICKRUIT · INTERVIEW PRACTICE</p>
      <h1>Find your next<br><span>question.</span></h1>
      <p class="intro">Choose your role and experience level. We’ll pick a random question for you.</p>

      <div class="setup-card">
        <label for="roleSelect">Role</label>
        <select id="roleSelect">
          <option value="Software Developer">Software Developer</option>
          <option value="Backend Engineer">Backend Engineer</option>
          <option value="Data Analyst">Data Analyst (SQL)</option>
        </select>

        <label for="levelSelect">Experience level</label>
        <select id="levelSelect">
          <option value="junior">Junior</option>
          <option value="senior">Senior</option>
        </select>

        <button id="startButton" class="button primary" type="button" disabled>GET A RANDOM QUESTION</button>
        <p id="questionCount" class="question-count" aria-live="polite">Loading questions…</p>
      </div>
      <p id="bankStatus" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="questionScreen" class="screen" hidden>
      <div class="question-top">
        <button id="changeSelectionButton" class="button quiet" type="button">← CHANGE ROLE</button>
        <p id="sessionLabel" class="session-label"></p>
      </div>
      <article class="question-card" aria-live="polite">
        <p id="questionNumber" class="question-number"></p>
        <p id="questionDescription" class="question-description"></p>
      </article>
      <div class="question-actions">
        <button id="nextQuestionButton" class="button primary" type="button">ANOTHER RANDOM QUESTION →</button>
      </div>
    </section>
  </main>

  <script>
    const elements = {
      setup: document.getElementById('setupScreen'),
      question: document.getElementById('questionScreen'),
      role: document.getElementById('roleSelect'),
      level: document.getElementById('levelSelect'),
      start: document.getElementById('startButton'),
      count: document.getElementById('questionCount'),
      status: document.getElementById('bankStatus'),
      sessionLabel: document.getElementById('sessionLabel'),
      number: document.getElementById('questionNumber'),
      description: document.getElementById('questionDescription')
    };

    const DIFFICULTIES_BY_LEVEL = {
      junior: new Set(['Easy', 'Medium']),
      senior: new Set(['Medium', 'Hard'])
    };
    const ROLE_COPY = {
      'Software Developer': {
        department: 'engineering',
        domain: 'software development'
      },
      'Backend Engineer': {
        department: 'backend engineering',
        domain: 'backend systems'
      },
      'Data Analyst': {
        department: 'data analytics',
        domain: 'data analytics and SQL'
      }
    };
    const DSA_QUESTIONS = Array.isArray(window.BUNDLED_QUESTIONS)
      ? window.BUNDLED_QUESTIONS
      : [];

    let sqlQuestions = [];
    let sqlLoadError = '';
    let eligibleQuestions = [];
    let questionQueue = [];
    let previousQuestionId = '';
    let questionNumber = 0;

    function shuffle(items) {
      const shuffled = [...items];
      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
      }
      return shuffled;
    }

    function getQuestions() {
      const role = elements.role.value;
      const level = elements.level.value;
      let questions;

      if (role === 'Software Developer') {
        questions = DSA_QUESTIONS;
      } else if (role === 'Backend Engineer') {
        questions = [
          ...DSA_QUESTIONS.filter((question) => question.roleApplicability?.includes('Backend')),
          ...sqlQuestions.filter((question) => question.roleApplicability?.includes('Backend'))
        ];
      } else {
        questions = sqlQuestions.filter((question) => question.roleApplicability?.includes('Data Analyst'));
      }

      return questions.filter((question) =>
        DIFFICULTIES_BY_LEVEL[level].has(question.difficulty)
      );
    }

    function updateSetup() {
      const count = getQuestions().length;
      elements.start.disabled = count === 0;
      elements.count.textContent = count
        ? `${count} questions available for this selection`
        : 'No questions are available for this selection.';
    }

    function showScreen(screen) {
      elements.setup.hidden = screen !== elements.setup;
      elements.question.hidden = screen !== elements.question;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function questionId(question) {
      return question.slug || question.description;
    }

    function nextRandomQuestion() {
      if (questionQueue.length === 0) {
        questionQueue = shuffle(eligibleQuestions);
        const lastIndex = questionQueue.length - 1;
        if (questionQueue.length > 1 && questionId(questionQueue[lastIndex]) === previousQuestionId) {
          [questionQueue[lastIndex], questionQueue[0]] = [questionQueue[0], questionQueue[lastIndex]];
        }
      }

      const question = questionQueue.pop();
      previousQuestionId = questionId(question);
      questionNumber += 1;

      const role = elements.role.value;
      const level = elements.level.value;
      const copy = ROLE_COPY[role];
      const replacements = {
        companyName: 'the company',
        department: copy.department,
        roleTitle: `${level === 'junior' ? 'Junior' : 'Senior'} ${role}`,
        domain: copy.domain,
        location: 'the office'
      };

      elements.sessionLabel.textContent = `${role} · ${level === 'junior' ? 'Junior' : 'Senior'}`;
      elements.number.textContent = `QUESTION ${questionNumber}`;
      elements.description.textContent = question.description.replace(
        /\{\{(companyName|department|roleTitle|domain|location)\}\}/g,
        (_, key) => replacements[key]
      );
    }

    async function loadQuestions() {
      try {
        const response = await fetch('./sql_questions.json');
        if (!response.ok) {
          throw new Error(`SQL question bank returned ${response.status}`);
        }
        const data = await response.json();
        if (!Array.isArray(data)) {
          throw new Error('SQL question bank format is invalid');
        }
        sqlQuestions = data;
      } catch (error) {
        console.error('Could not load the SQL question bank:', error);
        sqlLoadError = 'The SQL question bank could not be loaded. Data Analyst questions need the hosted page or a local web server.';
      }

      elements.status.textContent = sqlLoadError;
      updateSetup();
    }

    elements.role.addEventListener('change', updateSetup);
    elements.level.addEventListener('change', updateSetup);
    elements.start.addEventListener('click', () => {
      eligibleQuestions = getQuestions();
      if (eligibleQuestions.length === 0) {
        updateSetup();
        return;
      }

      questionQueue = shuffle(eligibleQuestions);
      previousQuestionId = '';
      questionNumber = 0;
      nextRandomQuestion();
      showScreen(elements.question);
    });
    document.getElementById('nextQuestionButton').addEventListener('click', nextRandomQuestion);
    document.getElementById('changeSelectionButton').addEventListener('click', () => {
      showScreen(elements.setup);
    });

    if (DSA_QUESTIONS.length === 0) {
      elements.status.textContent = 'The coding question bank could not be loaded.';
    } else {
      loadQuestions();
    }
  </script>
</body>
</html>
