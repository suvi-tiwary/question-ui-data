<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Trailers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="spot"></div><div class="bar top"></div><div class="bar bot"></div>
<main>
  <section id="cast" class="screen on">
    <div class="marquee">A CODING PRODUCTION</div>
    <h1 class="title">YOUR NEXT<br><em>INTERVIEW</em></h1>
    <p class="tag">Pick your role. Pick your level. Roll the trailer.</p>
    <div class="cast">
      <div><label>Role</label><div class="chips" id="roles"></div></div>
      <div><label>Level</label><div class="chips" id="levels"></div></div>
      <div><button class="btn" id="play">NEXT QUESTION &#8594;</button><p class="count" id="count"></p></div>
    </div>
    <p class="load" id="load"></p>
  </section>
  <section id="scene" class="screen"></section>
</main>
<script>
const $=id=>document.getElementById(id);
let DATA=[],pick={role:null,level:null},list=[],i=0;
const LEVELS=['Easy','Medium','Hard'];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=v=>esc(JSON.stringify(v));

function init(data){
  DATA=data;
  const roles=[...new Set(DATA.flatMap(q=>q.roleApplicability||[]))];
  const p=new URLSearchParams(location.search);       // ?role=Backend&level=Medium
  pick.role=roles.includes(p.get('role'))?p.get('role'):roles[0];
  pick.level=LEVELS.includes(p.get('level'))?p.get('level'):'Medium';
  chips('roles',roles,'role');chips('levels',LEVELS,'level');
  $('load').textContent='';count();
}
function chips(id,arr,key){
  $(id).innerHTML=arr.map(v=>`<button class="chip ${pick[key]===v?'sel':''}" data-v="${v}">${v.toUpperCase()}</button>`).join('');
  $(id).onclick=e=>{const b=e.target.closest('.chip');if(!b)return;pick[key]=b.dataset.v;chips(id,arr,key);count()};
}
const match=()=>DATA.filter(q=>(q.roleApplicability||[]).includes(pick.role)&&q.difficulty===pick.level);
function count(){const n=match().length;$('count').textContent=n?`${n} scene${n>1?'s':''} in this cut`:'No scenes for this role & level yet';$('play').disabled=!n;$('play').style.opacity=n?1:.4}
$('play').onclick=()=>{list=match();if(!list.length)return;i=0;show('scene');render()};
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));scrollTo(0,0)}

function render(){
  const q=list[i],tc=(q.testCases||[]).filter(t=>!t.isHidden);
  $('scene').innerHTML=`<div class="scene">
   <div class="reel"><span>Scene ${i+1} of ${list.length} &middot; ${esc(pick.role)}</span><button class="btn ghost" id="back">&#8592; RE-CAST</button></div>
    <header class="question-heading"><span class="badge ${q.difficulty}">${q.difficulty.toUpperCase()}</span><h1>${esc(q.title)}</h1></header>
   <div class="credits"><span>RUNTIME <b>${q.estimatedTimeMins} MIN</b></span><span>GENRE <b>${esc(q.topic)}</b></span><span>SUBPLOT <b>${esc(q.subtopic)}</b></span><span>TIME <b>${esc(q.expectedComplexity.time)}</b></span><span>SPACE <b>${esc(q.expectedComplexity.space)}</b></span></div>
   <p class="story">${esc(q.description)}</p>
   <div class="cols">
     <div><h2>THE RULES</h2><ul>${(q.constraints||[]).map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
       ${q.ioNote?`<p style="color:var(--dim);font-size:.85rem;margin-top:.8rem">${esc(q.ioNote)}</p>`:''}</div>
     <div><h2>SNEAK PEEK</h2>${tc.map((t,n)=>`<pre><b>Sample ${n+1}</b>\n${Object.entries(t.input).map(([k,v])=>`${k} = ${fmt(v)}`).join('\n')}\n<b>&rarr;</b> ${fmt(t.expectedOutput)}</pre>`).join('')}
       <p style="color:var(--dim);font-size:.8rem">Signature: <code>${esc(q.returnType)} ${esc(q.functionName)}(${q.parameters.map(p=>p.type+' '+p.name).join(', ')})</code></p></div>
   </div>
   <div class="nav"><button class="btn ghost" id="prev" ${i?'':'disabled style="opacity:.3"'}>&#8592; PREVIOUS</button>
   <button class="btn ghost" id="next">${i<list.length-1?'NEXT SCENE &#8594;':'THE END'}</button></div></div>`;
  $('back').onclick=()=>show('cast');
  $('prev').onclick=()=>{if(i){i--;render();scrollTo(0,0)}};
  $('next').onclick=()=>{i<list.length-1?(i++,render(),scrollTo(0,0)):show('cast')};
}
addEventListener('keydown',e=>{if(!$('scene').classList.contains('on'))return;
  if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});

// Load the bundled question bank; fetch requires a local web server.
fetch('question.json.txt').then(r=>{
  if(!r.ok)throw new Error(`Question bank returned ${r.status}`);
  return r.json();
}).then(init).catch(()=>{
  $('load').textContent='Could not load questions. Open this page through a local web server.';
  $('play').disabled=true;
});
</script>
</body>
</html>
